    query: "(HBM OR HBM4 OR NAND OR DRAM OR memory shortage OR CoWoS OR advanced packaging OR 300mm wafer OR substrate OR MLCC) lang:en"
    priority: high
  - name: "ai_power_and_datacenter"
    query: "(AI datacenter OR data center power OR liquid cooling OR grid interconnect OR nuclear power OR transformer shortage) lang:en"
    priority: high
  - name: "cpo_sic_pullback"

alert_policy:
  high:
    notify_when:
      - "top10_insight account posts original content with policy, supply-chain, earnings, or macro keywords"
      - "b_tier_pending_grade or utility account posts a sourced supply-chain or capex claim"
      - "Bernstein public-echo search surfaces AI, semiconductor, CPO, 800VDC, HBM, Rubin, or data-center capex research claims"
      - "utility headline account (DeItaone) reports Fed, CPI, jobs, tariff, China, energy, war, or exchange/regulatory event"
  medium:
    notify_when:
      - "crypto_liquidity_and_etf account reports ETF flow, liquidation, exchange issue, or on-chain whale flow"
      - "search query matches two or more independent accounts within 60 minutes"
  low:
    notify_when:
      - "b_tier_pending_grade or korea_semi account post is echoed by a top10_insight account or confirmed by news/filing"

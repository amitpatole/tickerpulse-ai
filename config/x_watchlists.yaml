version: 1
created_at: "2026-06-05"
owner: "Ming"
collector: "twscrape"
# Private X List mirroring the configured accounts (built by backend/scripts/sync_x_list.py).
# Account lane fetches this list timeline (1 endpoint, 500/15min) instead of 46 per-user
# timelines (50/15min) to avoid self-DOSing the rate limit.
list_id: "2065703090779492503"
description: >
  Curated X/Twitter watchlists for market-moving monitoring. The seed list came
  from Ming. Expanded accounts are selected to extend the same signal surface:
  policy shocks, macro headlines, AI/semi supply-chain bottlenecks, Asia tech,
  crypto liquidity, and ETF/on-chain flow.

collection_defaults:
  enabled: true
  include_replies: false
  include_retweets: true
  max_posts_per_account: 25
  poll_minutes: 20
  stale_after_hours: 48
  language: "mixed"

quality_filters:
  drop_obvious_promo: true
  drop_giveaways: true
  drop_telegram_signal_ads: true
  require_source_for_high_severity: true
  downgrade_uncited_claims: true
  promote_when_contains:
    - "guidance"
    - "forecast"
    - "supply"
    - "shortage"
    - "capacity"
    - "export control"
    - "tariff"
    - "earnings"
    - "backlog"
    - "capex"
    - "wafer"
    - "HBM"
    - "CoWoS"
    - "advanced packaging"
    - "power"
    - "data center"
    - "ETF"
    - "liquidation"

watchlists:

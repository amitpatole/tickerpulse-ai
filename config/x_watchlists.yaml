search_queries:
  - name: "bernstein_ai_semis"
    query: "(Bernstein OR 伯恩斯坦 OR \"Sanford Bernstein\") (AI OR semiconductor OR semis OR CPO OR 800V OR 800VDC OR HBM OR HBM4 OR Rubin OR NVL72 OR \"data center\" OR 光模块 OR 硅光 OR 中际旭创)"
    priority: high
  - name: "ai_memory_and_packaging"
    query: "(HBM OR HBM4 OR NAND OR DRAM OR memory shortage OR CoWoS OR advanced packaging OR 300mm wafer OR substrate OR MLCC) lang:en"
    priority: high
  - name: "ai_power_and_datacenter"
    query: "(AI datacenter OR data center power OR liquid cooling OR grid interconnect OR nuclear power OR transformer shortage) lang:en"
    priority: high
  - name: "cpo_sic_pullback"
    query: "(CPO OR \"co-packaged optics\" OR \"silicon photonics\" OR \"optical interconnect\" OR SiC OR Wolfspeed OR $AAOI OR $LITE OR $SIVE OR $SIVEF OR $WOLF OR $COHR OR $CRDO OR $CIEN) (pullback OR selloff OR \"new low\" OR earnings OR guidance OR \"data center\" OR AI) lang:en"
    priority: high
  - name: "spacex_ipo_trade"
    query: "(SpaceX OR Starlink OR $SPCX OR SPCX OR \"SpaceX IPO\" OR $RKLB OR RKLB) (IPO OR float OR lockup OR \"lock-up\" OR unlock OR borrow OR options OR Nasdaq OR \"index inclusion\" OR blowoff OR squeeze) lang:en"
    priority: high
  - name: "policy_export_controls"
    query: "(export controls OR tariff OR BIS OR Commerce Department OR China chips OR Taiwan semiconductors) lang:en"
    priority: high
  - name: "crypto_liquidity"
    query: "(ETF inflow OR ETF outflow OR liquidation OR whale OR Coinbase OR Binance OR Hyperliquid OR BTC OR ETH) lang:en"
    priority: medium
  - name: "ticker_cashtags_core"
    query: "($NVDA OR $AVGO OR $AMD OR $MRVL OR $MU OR $SMCI OR $VRT OR $RBRK OR $PLTR OR $COIN OR $MSTR OR $SOUN) lang:en"
    priority: medium

alert_policy:
  high:
    notify_when:
      - "user_seed_core account posts original content with policy, supply-chain, earnings, or macro keywords"
      - "expanded_high_signal account posts sourced supply-chain or capex claim"
      - "Bernstein public-echo search surfaces AI, semiconductor, CPO, 800VDC, HBM, Rubin, or data-center capex research claims"
      - "fast headline account reports Fed, CPI, jobs, tariff, China, energy, war, or exchange/regulatory event"
  medium:
    notify_when:
      - "crypto_liquidity_and_etf account reports ETF flow, liquidation, exchange issue, or on-chain whale flow"
      - "search query matches two or more independent accounts within 60 minutes"
  low:
    notify_when:
      - "discovery account post is echoed by high-signal account or confirmed by news/filing"

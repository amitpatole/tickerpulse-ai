# research contenders + dual fork grading). top10_insight = Ming's personal reading set;
# utility/crypto/b_tier_pending_grade kept for bot monitoring. 22 cut: 10 unproven
# discovery, 6 thin/redundant research (dylan522p=SemiAnalysis founder, PhotonCap,
# BenBajarin, teortaxesTex, tig88411109, dnystedt), 5 redundant headline relays
# (zerohedge/FirstSquawk/financialjuice/KobeissiLetter/Sino_Market), citrini (free
# feed=memes; alpha is paywalled). See memory reference_x_followlist_top5_regrade.
list_id: "2065703090779492503"
description: >
  Curated X/Twitter watchlists for market-moving monitoring, narrowed 2026-06-14 to a
  top-10 evidence-graded insight tier plus utility, crypto, korea-semi, and pending-grade
  lanes. Signal surface: AI/semi supply-chain bottlenecks, China chokepoints, actionable
  US equity, AI-infra/compute, macro/policy shocks, and ETF/on-chain flow.

collection_defaults:
  enabled: true
  include_replies: false
  include_retweets: true
  max_posts_per_account: 25
  poll_minutes: 20
  stale_after_hours: 48
  language: "mixed"

quality_filters:
  drop_obvious_promo: true
  drop_giveaways: true
  drop_telegram_signal_ads: true
  require_source_for_high_severity: true
  downgrade_uncited_claims: true
  promote_when_contains:
    - "guidance"
    - "forecast"
    - "supply"
    - "shortage"
    - "capacity"
    - "export control"
    - "tariff"
    - "earnings"
    - "backlog"
    - "capex"
    - "wafer"
    - "HBM"
    - "CoWoS"
    - "advanced packaging"
    - "power"
    - "data center"
    - "ETF"
    - "liquidation"


  - ticker: SPCX
    title: SpaceX short campaign entry window - squeeze entry preferred, hard fallback July 17
    event_date: "2026-07-17"
    review_window_start: "2026-06-16"
    review_window_end: "2026-07-17"
    stance_before_event: Daily watch. No position yet. Preferred entry is put spreads bought INTO a squeeze; if no squeeze by 2026-07-17 (T-15 before estimated August unlock), enter at market anyway at reduced size.
    user_note_basis: >
      SPCX IPO'd 2026-06-12 at $135 (all-primary, float ~4-5% of 13.1B shares),
      opened $151.74. Campaign: short the lock-up supply ladder over 3-6 months
      via defined-risk put spreads. Day-1 long was deliberately skipped. Key
      mechanic: 5-of-10 closes at or above $175.50 (130% of IPO) arms an extra
      +10% early insider unlock (~1.3B shares, ~2.4x float), so a squeeze
      manufactures its own future supply - squeeze top is the best put entry.
      AI-demand kicker: user tracks model-company token usage; xAI renting out
      Colossus reads as demand below capacity, pressuring the AI premium in the
      ~95x sales valuation. Starlink remains the value anchor bulls retreat to.
    process:
      - "Daily: check trigger tally (closes >= $175.50) and borrow fee on the monitor dashboard at D:\\Crypto Data\\Analysis\\20260611 - SPCX IPO short monitor\\dashboard.md (auto-refreshes 05:30 local)."
      - "2026-06-15/16: options listing and IBKR borrow data appear; confirm ATM IV, 90% put skew, and borrow fee start flowing on the dashboard."
      - "Squeeze entry (preferred): price above ~$190-200, or borrow > 150% with tally at 3+/10 closes - buy put spreads INTO the spike; skew flattens on rips so puts are relatively cheap at the top."
      - "Fallback entry: no squeeze by 2026-07-17 - enter at market regardless, smaller size. The unlock does not wait; squeeze is bonus entry, not precondition."
      - "Premium budget <= 2% NAV (~$7-8K) split across two expiries: Oct leg for the August unlock, Dec/Jan leg for the day-135/day-180 supply tail."
      - "Index adds (MSCI ~Jun 25-26, NDX fast entry ~Jul 3) are front-run non-events; entry is price-conditional, not calendar-conditional."
      - "Crowding gauge before sizing: borrow > 100% in late July means consensus trade - cut size or wait for post-unlock breakdown confirmation."
      - "Fill sizing fields (starter size, max size, capital source) in the operating system doc before the first order."
    avoid:
      - "SNK 2x-short ETF as the core position: swap financing passes through ~2x borrow cost plus daily-rebalance decay (~25%/month bleed at 100% borrow and 100% IV); tactical 1-3 day bursts only."
      - Naked stock short pre-unlock (borrow 50-300%+, recall and squeeze risk on a 4-5% float cult stock).
      - Waiting for a squeeze past the July 17 fallback deadline and missing the campaign.
      - "Hyperliquid SPCX perp as a borrow-fee escape: hard-to-short funding is borrow cost by another name; use only as a small breakdown-chase sleeve, and check funding first."
    sources:
      - https://www.sec.gov/Archives/edgar/data/1181412/000162828026040364/spaceexplorationtechnologib.htm
      - "D:\\Crypto Data\\Analysis\\20260611 - SPCX IPO short monitor\\dashboard.md"
